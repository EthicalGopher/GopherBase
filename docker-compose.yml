version: '3.8'

services:
  backend:
    image: ethicalgopher/gopherbase:latest
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://gopherbase:gopherbase@postgres:5432/gopherbase?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped
    depends_on:
      - postgres
      - ollama
    networks:
      - gopherbase-network

  frontend:
    image: ethicalgopher/gopherbase-frontend:latest
    ports:
      - "4173:4173"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - gopherbase-network

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: gopherbase
      POSTGRES_PASSWORD: gopherbase
      POSTGRES_DB: gopherbase
    restart: unless-stopped
    networks:
      - gopherbase-network

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: >
      /bin/bash -c "
      ollama serve &
      until ollama list > /dev/null 2>&1; do sleep 2; done &&
      ollama pull mistral:7b-instruct &&
      wait
      "
    networks:
      - gopherbase-network

volumes:
  postgres_data:
  ollama_data:

networks:
  gopherbase-network:
    driver: bridge

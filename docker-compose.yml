version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gopherbase
      POSTGRES_PASSWORD: gopherbase
      POSTGRES_DB: gopherbase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/bash", "-c", "ollama serve & sleep 5 && ollama pull deepseek-coder:6.7b && wait"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:

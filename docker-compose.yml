version: '3.8'

services:
  backend:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://gopherbase:gopherbase@postgres:5432/gopherbase?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped
    networks:
      - gopherbase-network

  frontend:
    build:
      context: ./Interface
    ports:
      - "4173:4173"
    environment:
      - VITE_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - VITE_ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gopherbase-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gopherbase
      POSTGRES_PASSWORD: gopherbase
      POSTGRES_DB: gopherbase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - gopherbase-network

  ollama:
    image: ollama/ollama:latest
    entrypoint: >
      /bin/bash -c "
      ollama serve &
      until ollama list; do sleep 2; done &&
      ollama pull mistral:7b-instruct &&
      wait
      "
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - gopherbase-network

volumes:
  postgres_data:
  ollama_data:

networks:
  gopherbase-network:
    driver: bridge
